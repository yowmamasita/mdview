name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # wry needs WebKitGTK; tao needs GTK and D-Bus.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libdbus-1-dev \
            pkg-config

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Build
        run: cargo build --release

      # The window itself needs a display; everything else runs headless.
      - name: Test
        run: cargo test --all-features

      - name: Test without the window
        run: cargo test --no-default-features

      # The bundle is what lets macOS treat mdview as a document handler, so a
      # broken packaging script should fail here rather than at install time.
      - name: Build the macOS app bundle
        if: runner.os == 'macOS'
        run: |
          scripts/bundle-macos.sh
          plutil -lint target/mdview.app/Contents/Info.plist
          test -f target/mdview.app/Contents/Resources/mdview.icns

      - name: Check the Linux desktop entry
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          desktop-file-validate packaging/linux/mdview.desktop
          bash -n scripts/install-linux.sh
