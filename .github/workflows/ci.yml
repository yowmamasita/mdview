name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # wry needs WebKitGTK; tao needs GTK and D-Bus.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libdbus-1-dev \
            pkg-config

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Build
        run: cargo build --release --features windows-console

      # The window itself needs a display; everything else runs headless.
      - name: Test
        run: cargo test --all-features

      - name: Test without the window
        run: cargo test --no-default-features

      # The bundle is what lets macOS treat mdview as a document handler, so a
      # broken packaging script should fail here rather than at install time.
      - name: Build the macOS app bundle
        if: runner.os == 'macOS'
        run: |
          scripts/bundle-macos.sh
          plutil -lint target/mdview.app/Contents/Info.plist
          test -f target/mdview.app/Contents/Resources/mdview.icns

      # `mdview.exe` must be GUI (2) so an Explorer launch raises no console;
      # `mdview-console.exe` must be console (3) so a shell waits for it and
      # redirection works. Getting either wrong is invisible until a user hits
      # it, so both are checked here.
      - name: Assert the subsystems
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Get-Subsystem($path) {
            $bytes = [IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            [BitConverter]::ToUInt16($bytes, $pe + 0x5C)
          }
          $dir = "target/release"
          $gui = Get-Subsystem "$dir/mdview.exe"
          $con = Get-Subsystem "$dir/mdview-console.exe"
          if ($gui -ne 2) { throw "mdview.exe: expected GUI (2), got $gui" }
          if ($con -ne 3) { throw "mdview-console.exe: expected console (3), got $con" }
          "mdview.exe GUI, mdview-console.exe console"

      # Redirection through the console binary, in both shells, since they
      # redirect differently. This is what a script would do.
      - name: Smoke test redirection
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "target/release/mdview-console.exe"
          & $exe --print-html README.md > pwsh.html
          if ((Get-Item pwsh.html).Length -lt 1000) { throw "pwsh redirect produced nothing" }
          # cmd needs a native path with backslashes, and quoting around it.
          $native = (Resolve-Path $exe).Path
          cmd /c "`"$native`" --version > cmd.txt"
          if ((Get-Item cmd.txt).Length -lt 5) { throw "cmd redirect produced nothing" }
          "pwsh $((Get-Item pwsh.html).Length) bytes, cmd $((Get-Item cmd.txt).Length) bytes"

      - name: Check the Linux desktop entry
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          desktop-file-validate packaging/linux/mdview.desktop
          bash -n scripts/install-linux.sh
