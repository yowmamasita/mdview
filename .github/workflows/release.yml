name: Release

on:
  push:
    tags: ["v*"]
  # Lets the whole matrix be exercised before a tag exists. Artifacts are
  # uploaded to the run; nothing is published.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag that disagrees with Cargo.toml ships binaries whose `--version`
  # contradicts the release they came from. Cheap to check, easy to forget.
  version:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match Cargo.toml
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "Cargo.toml: $crate"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "not a tag build; nothing to compare"
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          echo "tag:        $tag"
          if [ "$crate" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi

  # ---------------------------------------------------------------- macOS
  #
  # Both architectures are built on the arm64 runner and joined with `lipo`, so
  # there is one download that runs everywhere rather than two the user has to
  # choose between.
  macos:
    name: macOS (universal)
    needs: version
    runs-on: macos-14
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build both architectures
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Join into a universal binary
        run: |
          mkdir -p target/release
          lipo -create -output target/release/mdview \
            target/aarch64-apple-darwin/release/mdview \
            target/x86_64-apple-darwin/release/mdview
          lipo -info target/release/mdview

      # Present only if the repository has an Apple Developer certificate
      # configured. Without it the bundle is ad-hoc signed, which still runs but
      # is not notarised — see README, "A note on signing".
      - name: Import Developer ID certificate
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          keychain=$RUNNER_TEMP/build.keychain
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build the app bundle
        run: |
          # --no-build keeps the universal binary assembled above; a rebuild
          # would replace it with an arm64-only one.
          MDVIEW_SIGN_IDENTITY="${APPLE_SIGNING_IDENTITY:--}" \
            scripts/bundle-macos.sh --no-build

      # Either credential works. An App Store Connect API key is the better
      # one for CI — it is scoped, revocable, and unaffected by two-factor
      # prompts — but an Apple ID with an app-specific password is easier to
      # set up, so both are accepted.
      # Notarisation requires a Developer ID signature; submitting an ad-hoc
      # signed bundle is rejected. Requiring both means half-configured secrets
      # fall back to an unsigned release rather than failing the run.
      - name: Notarize
        if: env.APPLE_SIGNING_IDENTITY != '' && (env.APPLE_API_KEY != '' || env.APPLE_ID != '')
        run: |
          ditto -c -k --keepParent target/mdview.app "$RUNNER_TEMP/notarize.zip"

          if [ -n "$APPLE_API_KEY" ]; then
            echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/key.p8"
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
              --key "$RUNNER_TEMP/key.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
            rm -f "$RUNNER_TEMP/key.p8"
          else
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --wait
          fi

          # Stapling attaches the ticket to the bundle so it validates offline.
          xcrun stapler staple target/mdview.app
          xcrun stapler validate target/mdview.app

      # A tarball rather than a zip because it preserves the bundle's symlinks
      # and permission bits. It does not dodge Gatekeeper: current macOS
      # propagates the quarantine flag through `tar` just as it does through
      # Archive Utility, which is why scripts/install-macos.sh exists — a file
      # fetched by curl is never quarantined in the first place.
      - name: Package
        run: |
          mkdir -p dist
          # The application, with the bundle at the root so it can be dragged
          # straight into /Applications.
          rm -rf stage && mkdir -p stage
          cp -R target/mdview.app stage/
          cp README.md LICENSE stage/
          tar -C stage -czf dist/mdview-macos-universal-app.tar.gz .
          # The command line binary, in a directory of its own.
          rm -rf stage && mkdir -p stage/mdview-macos-universal
          cp target/release/mdview README.md LICENSE stage/mdview-macos-universal/
          tar -C stage -czf dist/mdview-macos-universal.tar.gz mdview-macos-universal

      - name: Smoke test
        run: |
          ./target/release/mdview --version
          ./target/release/mdview --print-html README.md > /dev/null
          codesign --verify --strict --verbose=2 target/mdview.app

      # If a certificate was configured, the result must actually clear
      # Gatekeeper. Silently shipping an ad-hoc build under a release that
      # claims to be signed would be worse than not signing at all.
      - name: Assert Gatekeeper accepts the bundle
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          codesign -dv --verbose=4 target/mdview.app 2>&1 | grep -E 'Authority|TeamIdentifier'
          spctl --assess --type execute --verbose=4 target/mdview.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------- Linux
  #
  # Built on the oldest runner image that still carries webkit2gtk-4.1, since
  # the glibc it links against sets the floor for which distributions can run
  # the result.
  linux:
    name: Linux (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libdbus-1-dev pkg-config

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          name=mdview-linux-${{ matrix.arch }}
          mkdir -p dist "stage/$name"
          cp target/${{ matrix.target }}/release/mdview "stage/$name/"
          cp packaging/linux/mdview.desktop "stage/$name/"
          cp packaging/macos/icon-1024.png "stage/$name/mdview.png"
          cp scripts/install-linux.sh "stage/$name/install.sh"
          cp README.md LICENSE "stage/$name/"
          chmod +x "stage/$name/install.sh" "stage/$name/mdview"
          tar -C stage -czf "dist/$name.tar.gz" "$name"

      - name: Smoke test
        run: |
          ./target/${{ matrix.target }}/release/mdview --version
          ./target/${{ matrix.target }}/release/mdview --print-html README.md > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # -------------------------------------------------------------- Windows
  windows:
    name: Windows (${{ matrix.arch }})
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
          - arch: aarch64
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --features windows-console

      - name: Package
        shell: pwsh
        run: |
          $name = "mdview-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path dist, "stage/$name" | Out-Null
          Copy-Item target/${{ matrix.target }}/release/mdview.exe "stage/$name/"
          Copy-Item target/${{ matrix.target }}/release/mdview-console.exe "stage/$name/"
          Copy-Item README.md, LICENSE "stage/$name/"
          Compress-Archive -Path "stage/$name" -DestinationPath "dist/$name.zip"

      # `mdview.exe` must be GUI (2) so an Explorer launch raises no console;
      # `mdview-console.exe` must be console (3) so a shell waits for it and
      # redirection works. Getting either wrong is invisible until a user hits
      # it, so both are checked here.
      - name: Assert the subsystems
        shell: pwsh
        run: |
          function Get-Subsystem($path) {
            $bytes = [IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            [BitConverter]::ToUInt16($bytes, $pe + 0x5C)
          }
          $dir = "target/${{ matrix.target }}/release"
          $gui = Get-Subsystem "$dir/mdview.exe"
          $con = Get-Subsystem "$dir/mdview-console.exe"
          if ($gui -ne 2) { throw "mdview.exe: expected GUI (2), got $gui" }
          if ($con -ne 3) { throw "mdview-console.exe: expected console (3), got $con" }
          "mdview.exe GUI, mdview-console.exe console"

      # Redirection through the console binary, in both shells, since they
      # redirect differently. This is what a script would do.
      - name: Smoke test redirection
        if: matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/mdview-console.exe"
          & $exe --print-html README.md > pwsh.html
          if ((Get-Item pwsh.html).Length -lt 1000) { throw "pwsh redirect produced nothing" }
          # cmd needs a native path with backslashes, and quoting around it.
          $native = (Resolve-Path $exe).Path
          cmd /c "`"$native`" --version > cmd.txt"
          if ((Get-Item cmd.txt).Length -lt 5) { throw "cmd redirect produced nothing" }
          "pwsh $((Get-Item pwsh.html).Length) bytes, cmd $((Get-Item cmd.txt).Length) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # -------------------------------------------------------------- publish
  release:
    name: Publish
    needs: [macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and checksum
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS
          ls -lh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "mdview ${GITHUB_REF_NAME}" \
            --notes-file .github/RELEASE_NOTES.md \
            --verify-tag
